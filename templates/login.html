<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anmelden – TerminPlaner</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-box">
      <div class="auth-logo">
        <h1>TerminPlaner</h1>
        <p>Terminverwaltung für Sie und Ihre Klienten</p>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endwith %}

      <form method="POST">
        <div class="form-group">
          <label for="email">E-Mail-Adresse</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="name@beispiel.de">
        </div>
        <div class="form-group">
          <label for="password">Passwort</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" style="flex:1">Anmelden</button>
        </div>
      </form>

      <div class="auth-link">
        Noch kein Konto? <a href="{{ url_for('register') }}">Jetzt registrieren</a>
      </div>
    </div>
  </div>
</body>
</html>
